services:
  bugaputa:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - bugaputa-data:/app/data
    environment:
      - NODE_ENV=production
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
    healthcheck:
      test: "wget -qO- http://localhost:3000/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bugaputa-data:
